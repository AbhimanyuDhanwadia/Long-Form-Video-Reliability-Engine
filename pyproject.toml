[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lfv-re-engine"
version = "0.1.0"
description = "Long-Form Video Reliability Engine: A deterministic orchestration pipeline for generative video."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Abhimanyu Dhanwadia"}
]
dependencies = [
    "langgraph>=1.0.0",
    "pydantic>=2.0.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.0.0",
    "pillow>=10.0.0",
    "requests>=2.0.0",
    "tenacity>=8.0.0",
    "typer>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black",
    "isort",
    "mypy"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    ".", "src"
]
